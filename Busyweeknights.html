<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easy Pregnancy Dinners for Busy Weeknights</title>
  <style>
    :root {
      --cream: #f6f0e8;
      --warm-white: #fffaf5;
      --sand: #e7d7c7;
      --rust: #b86742;
      --rust-deep: #8f4b2f;
      --brown: #3f2a22;
      --brown-soft: #6a5146;
      --shadow: 0 18px 40px rgba(63, 42, 34, 0.12);
      --shadow-hover: 0 24px 50px rgba(63, 42, 34, 0.18);
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --max-width: 1220px;
      --transition: 0.3s ease;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, #fffaf5 0%, #f7efe6 100%);
      color: var(--brown);
      line-height: 1.65;
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; }

    .container {
      width: min(92%, var(--max-width));
      margin: 0 auto;
    }

    .hero {
      position: relative;
      min-height: 88vh;
      display: flex;
      align-items: center;
      background:
        linear-gradient(rgba(37, 22, 16, 0.48), rgba(37, 22, 16, 0.58)),
        url("https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1800&q=80") center center / cover no-repeat;
      color: #fff9f4;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(255, 236, 217, 0.18), transparent 35%);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      width: min(92%, 980px);
      margin: 0 auto;
      padding: 84px 0;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 250, 245, 0.14);
      border: 1px solid rgba(255, 250, 245, 0.22);
      backdrop-filter: blur(6px);
      font-size: 0.86rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0 0 18px;
      font-size: clamp(2.6rem, 5vw, 5.2rem);
      line-height: 1.04;
      font-weight: 700;
      max-width: 900px;
      letter-spacing: -0.02em;
    }

    .hero p {
      max-width: 720px;
      margin: 0 0 34px;
      font-size: clamp(1.08rem, 1.8vw, 1.32rem);
      color: rgba(255, 248, 241, 0.92);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .nav-btn,
    .print-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 20px;
      border-radius: 999px;
      font-size: 0.98rem;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition);
      box-shadow: 0 10px 24px rgba(18, 10, 7, 0.16);
    }

    .nav-btn {
      background: rgba(255, 248, 241, 0.96);
      color: var(--brown);
    }

    .nav-btn:hover,
    .nav-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(18, 10, 7, 0.22);
      background: #ffffff;
      outline: none;
    }

    .print-btn {
      background: transparent;
      color: #fff7f0;
      border: 1px solid rgba(255, 247, 240, 0.5);
    }

    .print-btn:hover,
    .print-btn:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 247, 240, 0.12);
      outline: none;
    }

    .intro {
      padding: 72px 0 28px;
    }

    .intro-wrap {
      max-width: 860px;
      margin: 0 auto;
      text-align: center;
    }

    .intro h2 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 3vw, 2.8rem);
      line-height: 1.15;
      color: var(--brown);
      letter-spacing: -0.02em;
    }

    .intro p {
      margin: 0;
      font-size: 1.08rem;
      color: var(--brown-soft);
    }

    .recipes {
      padding: 26px 0 84px;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    .recipe-card {
      background: rgba(255, 250, 245, 0.92);
      border: 1px solid rgba(143, 75, 47, 0.08);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .recipe-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .recipe-image {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #eadbcf;
    }

    .recipe-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .recipe-card:hover .recipe-image img {
      transform: scale(1.04);
    }

    .recipe-content {
      padding: 28px 26px 26px;
    }

    .recipe-anchor {
      position: relative;
      top: -90px;
    }

    .recipe-title {
      margin: 0 0 12px;
      font-size: 1.7rem;
      line-height: 1.18;
      color: var(--brown);
    }

    .recipe-desc {
      margin: 0 0 20px;
      color: var(--brown-soft);
      font-size: 1rem;
    }

    .recipe-meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .block {
      background: linear-gradient(180deg, rgba(246, 240, 232, 0.88), rgba(255, 250, 245, 0.94));
      border-radius: var(--radius-lg);
      padding: 18px 18px 16px;
    }
